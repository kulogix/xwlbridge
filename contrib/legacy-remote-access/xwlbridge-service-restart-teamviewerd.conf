# ~/.config/systemd/user/xwlbridge.service.d/restart-teamviewerd.conf (RHEL 10 and rebuilds; TeamViewer-specific)
# Restart teamviewerd once the bridge display :20 is up (allowed by teamviewerd-restart.polkit.rules.in), so a
# TeamViewer whose GUI died with the previous X server serves the new one. "-": a failure never fails the bridge.
[Service]
ExecStartPost=-/bin/sh -c 'for i in $(seq 50); do [ -S /tmp/.X11-unix/X20 ] && break; sleep 0.2; done; sleep 2; exec /usr/bin/systemctl try-restart teamviewerd.service'
