# /etc/systemd/system/teamviewerd.service.d/xwlbridge.conf (drop-in for the vendor's service; here TeamViewer's)
# TeamViewer opens /var/run/dbus/system_bus_socket by path (DBUS_SYSTEM_BUS_ADDRESS is ignored), so the proxy's
# directory is bind-mounted over /run/dbus in the daemon's own mount namespace: the daemon and every process it
# starts itself see the proxied logind. No LD_PRELOAD. (BindPaths= cannot target the socket file itself: systemd
# fails with status 226/NAMESPACE.)
[Unit]
Requires=xwlbridge-login1-proxy.service
After=xwlbridge-login1-proxy.service

[Service]
BindPaths=/run/xwlbridge-login1:/run/dbus
