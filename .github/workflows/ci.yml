name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # the GNOME backend (feature "gnome") links libpipewire through bindgen
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config clang libclang-dev libpipewire-0.3-dev libspa-0.2-dev
      # the toolchain pinned in rust-toolchain.toml, with clippy and rustfmt
      - run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features gnome,xvfb -- -D warnings
      - run: cargo test
      - run: cargo test --features gnome,xvfb
      - run: cargo build --release --features gnome,xvfb
      - run: target/release/xwlbridge -version

  scripts:
    name: packaging and x11-a11y-proxy unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
          python3-gi gir1.2-gtk-4.0 gir1.2-atspi-2.0 python3-xlib
      - run: bash packaging/tests/test_ctl.sh
      - run: python3 -m unittest discover -s tools/x11-a11y-proxy/tests -p test_unit.py -v
