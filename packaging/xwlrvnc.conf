# xwlrvnc: RealVNC Server on the GNOME (Wayland) desktop through the X11 bridge.
#
# This file is read by `xwlrvnc-ctl run`, which the systemd user service
# xwlrvnc.service starts with your GNOME session.
#
#   xwlrvnc-ctl config set KEY VALUE   change a setting
#   xwlrvnc-ctl restart                apply changes (viewers reconnect)
#   xwlrvnc-ctl doctor                 check the setup
#   xwlrvnc-ctl command                show the exact command the service runs
#
# Syntax: KEY=value, one per line. Lines starting with '#' are comments. No
# shell expansion. In the *_args values, words are split at spaces; quote a
# word that contains spaces ("..." or '...').

# X server that the VNC server talks to (the "engine"):
#   auto     xvnc when TigerVNC's Xvnc is installed, else builtin
#   builtin  xwlrvnc's own lean X server; needs no extra packages
#   xvnc     TigerVNC's Xvnc: every X extension, follows monitor changes
#            (sudo apt install tigervnc-standalone-server)
#   xvfb     Xorg's Xvfb: every X extension, fixed screen size
#            (sudo apt install xvfb)
# RealVNC's own Xvnc (/usr/bin/Xvnc from realvnc-vnc-server, set-uid root) is
# never used as the engine.
engine=auto

# How the desktop is captured from GNOME:
#   area     RecordArea per monitor (safe on every mutter)
#   monitor  RecordMonitor (damage hints); only on mutter >= 51: older mutter
#            crashes when a recorded monitor is disabled (mutter#2718)
capture=area

# Where RealVNC's own windows (status dialog, tray icon, connection notices,
# chat, file transfer, its clipboard) appear:
#   auto     on the GNOME desktop (its Xwayland). RealVNC then runs without its
#            root helper: system authentication works for your own account only,
#            and remote printing needs membership in the lpadmin group.
#   none     hidden (on the bridge's own display). Needs engine xvnc or xvfb:
#            on the built-in X server RealVNC's windows crash, so with
#            engine=builtin the service refuses none and waits for the desktop
#            display rather than start RealVNC without it.
#   :N       on that X display
uidisplay=auto

# VNC server program (RealVNC Server 6.x/7.x, user mode).
server=vncserver-x11

# TCP port viewers connect to, passed to RealVNC as -RfbPort (which overrides
# RealVNC's own RfbPort setting).
#   realvnc  (or empty) leave the port to RealVNC's own settings: RfbPort in
#            ~/.vnc/config.d/vncserver-x11 or its Options dialog (default 5900).
#            With this and an empty server_args, RealVNC's own configuration
#            decides the port, the IP address filter (IpClientAddresses),
#            authentication and encryption; xwlrvnc passes none of them.
# Port 5900 is taken while RealVNC's system service (vncserver-x11-serviced)
# runs; `xwlrvnc-ctl doctor` explains the choice.
rfb_port=5900

# RealVNC log level written to the journal (0-100; 30 = connections and
# errors). Empty: RealVNC's own Log setting (log files in ~/.vnc).
server_log=30

# More RealVNC Server parameters (they override RealVNC's own settings), e.g.
#   server_args=-Encryption=AlwaysOn -Authentication=VncAuth
# (set a VNC password with: vncpasswd -user). Leave it empty to keep
# authentication, encryption and IpClientAddresses in RealVNC's settings.
server_args=

# Bridge log level: quiet | normal | verbose
log=normal

# More xwlrvnc options (see: xwlrvnc -help).
bridge_args=

# TigerVNC Xvnc / Xvfb binaries for the xvnc / xvfb engines. auto: found on
# PATH (Xtigervnc first). A binary that is set-uid/set-gid or comes from
# RealVNC is refused.
xvnc=auto
xvfb=auto
